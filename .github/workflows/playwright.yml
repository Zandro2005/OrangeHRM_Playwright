# Step 1: Name the workflow and trigger it on push, pull request, or manual run
name: Playwright CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  playwright-tests:
    # Step 2: Run on Ubuntu with a 3-browser matrix (Chromium, Firefox, WebKit)
    name: Run Playwright (${{ matrix.browser }})
    timeout-minutes: 30
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      # Step 3: Pull the repository code onto the GitHub Actions runner
      - name: Checkout GitHub Repository
        uses: actions/checkout@v4

      # Step 4: Install Node.js v22
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Step 5: Install npm packages from package.json
      - name: Install Dependencies
        run: npm install

      # Step 6: Install only the current matrix browser and its Linux OS dependencies
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      # Step 7: Run Playwright tests for this browser (uses GitHub Secrets for credentials)
      - name: Run Playwright Tests (${{ matrix.browser }})
        run: npx playwright test --project=${{ matrix.browser }}
        env:
          BASE_URL: ${{ vars.BASE_URL || 'https://opensource-demo.orangehrmlive.com' }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      # Step 8: Upload the generated HTML report even if a test fails
      - name: Upload HTML Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 14

      # Step 9: Upload failure screenshots, videos, and traces from test-results/
      - name: Upload Failure Artifacts (Screenshots, Videos, Traces)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

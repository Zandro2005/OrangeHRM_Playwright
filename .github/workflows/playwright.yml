# Step 1: Name the workflow and trigger it on push, pull request, or manual run
name: Playwright CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  playwright-tests:
    # Step 2: Run Modules 1-6 in parallel across all 5 Playwright projects (3 desktop + 2 mobile)
    name: Run Playwright (${{ matrix.project }})
    timeout-minutes: 30
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            engine: chromium
          - project: firefox
            engine: firefox
          - project: webkit
            engine: webkit
          - project: Mobile Chrome
            engine: chromium
          - project: Mobile Safari
            engine: webkit

    steps:
      # Step 3: Pull the repository code onto the GitHub Actions runner
      - name: Checkout GitHub Repository
        uses: actions/checkout@v4

      # Step 4: Install Node.js v22 and cache npm downloads using package-lock.json
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Step 5: Clean deterministic install from package-lock.json (sets Linux +x permissions on .bin)
      - name: Install Dependencies
        run: npm ci

      # Step 6: Install the underlying browser engine & Linux OS deps for this matrix job
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps ${{ matrix.engine }}

      # Step 7: Run non-global-mutating Playwright tests for this project (Modules 1-6)
      - name: Run Playwright Tests (${{ matrix.project }})
        run: |
          npx playwright test --project="${{ matrix.project }}" --grep-invert "Module 7: Settings & Configuration"
        env:
          BASE_URL: ${{ vars.BASE_URL || 'https://opensource-demo.orangehrmlive.com' }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      # Step 8: Upload the generated HTML report even if a test fails
      - name: Upload HTML Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14

      # Step 9: Upload failure screenshots, videos, and traces from test-results/
      - name: Upload Failure Artifacts (Screenshots, Videos, Traces)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.project }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  playwright-settings:
    # Run Module 7 (Settings & Configuration) on a single runner after parallel jobs finish
    # so global OrangeHRM server settings (Localization, Modules, Branding) never collide across VMs
    name: Run Playwright Settings (All Browsers)
    needs: playwright-tests
    if: ${{ !cancelled() }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    concurrency:
      group: orangehrm-global-settings
      cancel-in-progress: false

    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Module 7 Settings Tests (All 5 Projects)
        run: npx playwright test tests/settings.spec.ts
        env:
          BASE_URL: ${{ vars.BASE_URL || 'https://opensource-demo.orangehrmlive.com' }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - name: Upload HTML Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-settings
          path: playwright-report/
          retention-days: 14

      - name: Upload Failure Artifacts (Screenshots, Videos, Traces)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-settings
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
